var wrap = document.getElementById('wrap');
var qEl = document.getElementById('q');
var chipsEl = document.getElementById('chips');
var cntEl = document.getElementById('cnt');
var cnEl = document.getElementById('cn');
var all = [];                 /* {el, kw, cat, secEl, gridEl} */
var curCat = '全部';

/* 渲染分类区 */
SITES.forEach(function (sec) {
  var box = document.createElement('section');
  var h = document.createElement('div');
  h.className = 'sec';
  h.innerHTML = '<span></span><small></small>';
  h.querySelector('span').textContent = sec.sec;
  h.querySelector('small').textContent = sec.items.length + ' 个';
  var g = document.createElement('div');
  g.className = 'grid';
  sec.items.forEach(function (it) {
    var host = (it.url || '').replace(/^https?:\/\//, '').split('/')[0];
    var a = document.createElement('a');
    a.className = 'site';
    a.href = it.url;
    a.target = '_blank';
    a.rel = 'noopener';
    a.setAttribute('data-cat', sec.sec);
    var kw = (sec.sec + ' ' + it.name + ' ' + it.desc).toLowerCase();
    a.setAttribute('data-kw', kw);
    var fav = document.createElement('span');
    fav.className = 'fav';
    fav.textContent = (it.name || '?').charAt(0);
    var img = document.createElement('img');
    img.alt = ''; img.loading = 'lazy';
    img.src = 'https://' + host + '/favicon.ico';
    img.onerror = function () { img.remove(); };
    fav.appendChild(img);
    var t = document.createElement('span');
    t.className = 'txt';
    t.innerHTML = '<span class="nm"></span><span class="ds"></span>';
    t.querySelector('.nm').textContent = it.name;
    t.querySelector('.ds').textContent = it.desc || '';
    a.appendChild(fav); a.appendChild(t);
    g.appendChild(a);
    all.push({ el: a, kw: kw, cat: sec.sec, gridEl: g, secEl: box });
  });
  box.appendChild(h);
  box.appendChild(g);
  wrap.appendChild(box);
});

cntEl.textContent = all.length;
cnEl.textContent = SITES.length;

/* 分类筛选 chips */
function toast(m) {
  var t = document.getElementById('toast');
  t.textContent = m; t.classList.add('on');
  clearTimeout(toast._t); toast._t = setTimeout(function () { t.classList.remove('on'); }, 1400);
}

function chipRow() {
  var mk = function (label, val) {
    var b = document.createElement('button');
    b.type = 'button';
    b.className = 'chip' + (val === curCat ? ' on' : '');
    b.textContent = label;
    b.addEventListener('click', function () {
      curCat = val;
      chipsEl.querySelectorAll('.chip').forEach(function (c) { c.classList.remove('on'); });
      b.classList.add('on');
      apply();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    });
    return b;
  };
  chipsEl.appendChild(mk('全部', '全部'));
  SITES.forEach(function (s) { chipsEl.appendChild(mk(s.sec + ' ' + s.items.length, s.sec)); });
}

function apply() {
  var q = qEl.value.trim().toLowerCase();
  var shown = 0, secShown = 0;
  var visBySec = new Map();
  all.forEach(function (o) {
    var okCat = (curCat === '全部') || (o.cat === curCat);
    var okQ = !q || o.kw.indexOf(q) >= 0;
    var vis = okCat && okQ;
    o.el.style.display = vis ? '' : 'none';
    o.secEl.style.display = 'none';   /* 先全部藏，下面按需显示 */
    if (vis) { shown++; visBySec.set(o.secEl, true); }
  });
  all.forEach(function (o) { if (o.el.style.display !== 'none') o.secEl.style.display = ''; });
  visBySec.forEach(function (_, secEl) { secShown++; });
  cntEl.textContent = shown;
  cnEl.textContent = secShown;
  if (shown === 0) {
    if (!document.getElementById('none')) {
      var e = document.createElement('div');
      e.id = 'none'; e.className = 'empty';
      e.textContent = '没有匹配的站点，换个关键词试试';
      wrap.appendChild(e);
    }
  } else {
    var e = document.getElementById('none');
    if (e) e.remove();
  }
}

qEl.addEventListener('input', apply);
chipRow();
apply();

if ('serviceWorker' in navigator) {
  window.addEventListener('load', function () {
    navigator.serviceWorker.register('sw.js').catch(function () {});
  });
}
</script>
