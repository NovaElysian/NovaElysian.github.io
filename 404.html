<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>页面走丢了 · 通用T显编辑器</title>
<meta name="description" content="找不到这个页面 —— 返回通用T显编辑器首页继续制作 titleraw 排版指令。">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#fb7299">
<link rel="icon" href="/favicon.ico" type="image/x-icon">
<link rel="apple-touch-icon" href="/icon-192.png">
<link rel="manifest" href="/manifest.json">
<style>
:root{--accent:#5c6672;--bg:#f5f6f8;--card:#fff;--text:#1a1a1a;--sub:#777;--border:#e0e0e0}
@media (prefers-color-scheme:dark){:root{--bg:#151724;--card:#1a1c29;--text:#e0e0e0;--sub:#a0a0a0;--border:#2a2d3e}}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI","Noto Sans SC",sans-serif;display:flex;align-items:center;justify-content:center;padding:24px;-webkit-tap-highlight-color:transparent}
.wrap{max-width:440px;width:100%;text-align:center}
.code{font-size:5rem;font-weight:800;line-height:1;background:linear-gradient(135deg,var(--accent),#a855f7);-webkit-background-clip:text;background-clip:text;color:transparent;letter-spacing:.05em}
h1{font-size:1.25rem;margin:18px 0 8px;font-weight:700}
p{color:var(--sub);font-size:.92rem;line-height:1.7;margin:0 0 26px}
.actions{display:flex;gap:12px;flex-direction:column}
a.btn{display:block;padding:13px 20px;border-radius:12px;text-decoration:none;font-size:.95rem;font-weight:600;background:var(--accent);color:#fff;transition:transform .15s,opacity .15s}
a.btn.ghost{background:transparent;color:var(--text);border:1.5px solid var(--border)}
a.btn:active{transform:scale(.97);opacity:.85}
.hint{margin-top:22px;font-size:.78rem;color:var(--sub);opacity:.75}
</style>
</head>
<body>
  <div class="wrap">
    <div class="code">404</div>
    <h1>这个页面不存在</h1>
    <p>链接可能已经失效，或者地址输错了。<br>回到首页继续做 T显 排版吧。</p>
    <div class="actions">
      <a class="btn" href="/">返回首页</a>
      <a class="btn ghost" href="/fuhao.html">去符号库看看</a>
    </div>
    <div class="hint">通用T显编辑器 · 网易基岩版 titleraw 排版工具</div>
  </div>
</body>
</html>
