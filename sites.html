<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>网站导航 · 通用T显编辑器</title>
<meta name="description" content="Minecraft 基岩版常用工具站导航：字体符号、像素地图画、音乐转换、存档 NBT、命令生成、文档百科，全部人工整理。">
<meta name="keywords" content="MC工具,基岩版,网站导航,像素画,NBT,指令生成器,符号,字体">
<meta name="theme-color" content="#1f2328">
<link rel="icon" href="favicon.ico" type="image/x-icon">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="manifest" href="manifest.json">
<style>
:root{--accent:#1f2328;--bg:#f5f6f8;--card:#fff;--text:#1a1a1a;--sub:#777;--border:#e0e0e0}
@media (prefers-color-scheme:dark){:root{--bg:#151724;--card:#1a1c29;--text:#e0e0e0;--sub:#a0a0a0;--border:#2a2d3e}}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI","Noto Sans SC",sans-serif;padding:0 0 32px;-webkit-tap-highlight-color:transparent}
header{position:sticky;top:0;z-index:20;background:var(--bg);border-bottom:1px solid var(--border);padding:calc(12px + env(safe-area-inset-top,0px)) 14px 12px}
.hrow{max-width:720px;margin:0 auto;display:flex;align-items:center;gap:10px}
h1{font-size:1.05rem;margin:0;font-weight:700;flex:1}
h1 span{color:var(--accent)}
a.back{font-size:.82rem;color:var(--sub);text-decoration:none;border:1px solid var(--border);padding:6px 11px;border-radius:9px;white-space:nowrap}
a.back:hover{color:var(--accent);border-color:var(--accent)}
main{max-width:720px;margin:0 auto;padding:14px}
.searchbar{display:flex;gap:8px;align-items:center;margin-bottom:6px}
input[type=search]{flex:1;font:inherit;font-size:.88rem;padding:10px 12px;border-radius:11px;border:1px solid var(--border);background:var(--card);color:var(--text);outline:none}
input[type=search]:focus{border-color:var(--accent)}
.more-banner{display:flex;align-items:center;gap:12px;margin:0 0 12px;padding:13px 14px;border-radius:12px;background:var(--card);border:1px solid var(--border);text-decoration:none;color:var(--text);transition:border-color .12s,transform .12s}
.more-banner:hover{border-color:var(--accent);transform:translateY(-1px)}
.mb-txt{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.mb-t{font-size:.92rem;font-weight:700}
.mb-d{font-size:.75rem;color:var(--sub);line-height:1.4}
.mb-go{font-size:.85rem;color:var(--accent);font-weight:600}

.meta{font-size:.76rem;color:var(--sub);margin:0 0 12px;line-height:1.6}
.meta b{color:var(--accent);font-weight:600}
.sec{margin:18px 0 8px;font-size:.86rem;font-weight:700;color:var(--text);display:flex;align-items:center;gap:8px}
.sec::after{content:'';flex:1;height:1px;background:var(--border)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:9px}
.site{display:flex;align-items:center;gap:10px;padding:11px 12px;border-radius:12px;background:var(--card);border:1px solid var(--border);text-decoration:none;color:var(--text);transition:transform .12s,border-color .12s}
.site:hover{transform:translateY(-2px);border-color:var(--accent)}
.site:active{transform:scale(.98)}
.fav{width:34px;height:34px;border-radius:9px;flex:none;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:15px;color:#fff;background:#1f2328;overflow:hidden}
.fav img{width:18px;height:18px;display:block}
.txt{min-width:0}
.nm{font-size:.9rem;font-weight:600;line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ds{font-size:.74rem;color:var(--sub);line-height:1.4;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.empty{padding:30px 0;text-align:center;color:var(--sub);font-size:.86rem}
footer{max-width:720px;margin:26px auto 0;padding:0 14px;font-size:.74rem;color:var(--sub);text-align:center;line-height:1.8}
#toast{position:fixed;left:50%;bottom:28px;transform:translate(-50%,20px);background:#1a2232;color:#fff;padding:11px 18px;border-radius:11px;font-size:.86rem;opacity:0;pointer-events:none;transition:.22s;z-index:99;max-width:88vw}
#toast.on{opacity:1;transform:translate(-50%,0)}
</style>
</head>
<body>
<header>
  <div class="hrow">
    <h1>网站 / <span>导航</span></h1>
    <a class="back" href="index.html">返回主页</a>
  </div>
</header>

<main>
  <div class="searchbar">
    <input type="search" id="q" placeholder="搜索站点名或功能…" autocomplete="off" spellcheck="false">
  </div>
  <a class="more-banner" href="more.html"><span class="mb-txt"><span class="mb-t">更多网站 · 337 站</span><span class="mb-d">综合导航：工具 / 开发 / 设计 / 教育 / 娱乐 / 生活 等 53 个分类</span></span><span class="mb-go">进入 ›</span></a>
  <p class="meta">共 <b id="cnt">0</b> 个站点 · <b id="cn">0</b> 个分类 · 点击卡片直接打开</p>
  <div id="wrap"></div>
</main>

<footer>通用T显编辑器 · 网站导航 —— 数据与指令工坊同源，已独立成页并扩充</footer>
<div id="toast"></div>

<script>
/* 站点数据：源自指令工坊「网站」标签，此处独立维护并扩充 */
var SITES = [{
            sec: "字体与符号",
            secIco: "",
            items: [{
                    name: "InstaFonts",
                    desc: "花体字体生成",
                    url: "https://instafonts.io/"
                },
                {
                    name: "特殊字符",
                    desc: "特殊符号与字符工具",
                    url: "https://teshuzifu.cn/"
                }
            ]
        },
        {
            sec: "像素画与地图画",
            secIco: "",
            items: [{
                    name: "MCPixelArt",
                    desc: "像素画、地图画、投影",
                    url: "https://mcpixelart.com/2d"
                },
                {
                    name: "Spritecraft",
                    desc: "图片转像素画",
                    url: "https://autosaved.org/spritecraft"
                },
                {
                    name: "MinecraftArt",
                    desc: "像素画、投影、地图画生成",
                    url: "https://www.minecraftart.net/zh/"
                },
                {
                    name: "MapartCraft",
                    desc: "地图画 schematic 制作",
                    url: "https://rebane2001.com/mapartcraft/zh-Hans"
                },
                {
                    name: "mcimg",
                    desc: "投影文件下载",
                    url: "https://www.mcimg.com"
                }
            ]
        },
        {
            sec: "音乐与转换",
            secIco: "",
            items: [{
                    name: "MidiShow",
                    desc: "MIDI 音乐资源",
                    url: "https://www.midishow.com/"
                },
                {
                    name: "指令音乐压缩工具",
                    desc: "压缩音乐命令体积",
                    url: "https://backend.appmiaoda.com/projects/supabase298428991113572352/functions/v1/serve_website?name=compress"
                },
                {
                    name: "Dislink 工具合集",
                    desc: "MIDI转mcpack/mcstructure、mcfunction转换、图片转mcfunction等",
                    url: "https://dislink.github.io"
                }
            ]
        },
        {
            sec: "存档与NBT",
            secIco: "",
            items: [{
                    name: "Amulet",
                    desc: "存档编辑与转换",
                    url: "https://www.amuletmc.com/"
                },
                {
                    name: "NBT Studio",
                    desc: "NBT 数据编辑器",
                    url: "https://github.com/tryashtar/nbt-studio/releases"
                }
            ]
        },
        {
            sec: "综合工具",
            secIco: "",
            items: [{
                name: "小舟工具箱",
                desc: "常用指令工具箱",
                url: "https://tool.lonzov.top"
            }, {
                name: "MC Toolbox",
                desc: "give/指令生成器，支持基岩版组件",
                url: "https://mctoolbox.net/zh-cn"
            }, {
                name: "CraftCMD",
                desc: "give/loot/execute 等命令构建器",
                url: "https://www.craftcmd.com/give"
            }, {
                name: "MineBuildr",
                desc: "指令/数据包/像素画工具集",
                url: "https://minebuildr.com/tools/command-generator"
            }, {
                name: "MCWorldTools",
                desc: "多版本命令生成器",
                url: "https://mcworldtools.com/tools/command-generator"
            }]
        },
        {
            sec: "结构与格式",
            secIco: "",
            items: [{
                    name: "4D皮肤模型",
                    desc: "4D 皮肤模型生成",
                    url: "https://fangkuaichaoge.github.io/"
                },
                {
                    name: "Schem To Schematic",
                    desc: "结构格式转换",
                    url: "https://schemtoschematic.app"
                },
                {
                    name: "MC Schematic",
                    desc: "格式转换与结构工具",
                    url: "https://www.mcschematic.top/"
                }
            ]
        }
    ];

/* 扩充分类（文档与百科 / 命令与皮肤） */
SITES.push({
  sec: "文档与百科",
  secIco: "",
  items: [
    { name: "Minecraft 中文 Wiki", desc: "游戏机制 / 指令 / 方块数据 权威百科", url: "https://zh.minecraft.wiki/" },
    { name: "Bedrock Wiki",       desc: "基岩版开发与行为包文档",           url: "https://wiki.bedrock.dev/" },
    { name: "网易开发者平台",      desc: "网易中国版组件与 API 文档",         url: "https://mc.163.com/dev/" }
  ]
});
SITES.push({
  sec: "命令与皮肤",
  secIco: "",
  items: [
    { name: "MCStacker",   desc: "指令生成器",              url: "https://mcstacker.net/" },
    { name: "Nova Skin",   desc: "皮肤编辑器 / 皮肤画廊",    url: "https://minecraft.novaskin.me/" }
  ]
});

var wrap = document.getElementById('wrap');
var qEl = document.getElementById('q');
var cntEl = document.getElementById('cnt');
var cnEl = document.getElementById('cn');
var all = [];

SITES.forEach(function (sec) {
  var box = document.createElement('div');
  var h = document.createElement('div');
  h.className = 'sec';
  h.textContent = sec.sec;
  var g = document.createElement('div');
  g.className = 'grid';
  sec.items.forEach(function (it) {
    var host = (it.url || '').replace(/^https?:\/\//, '').replace(/\/$/, '');
    var a = document.createElement('a');
    a.className = 'site';
    a.href = it.url;
    a.target = '_blank';
    a.rel = 'noopener';
    a.setAttribute('data-kw', (sec.sec + ' ' + it.name + ' ' + it.desc).toLowerCase());
    var fav = document.createElement('span');
    fav.className = 'fav';
    fav.textContent = (it.name || '?').charAt(0);
    var img = document.createElement('img');
    img.alt = '';
    img.loading = 'lazy';
    img.src = 'https://' + host.split('/')[0] + '/favicon.ico';
    img.onerror = function () { img.remove(); };
    fav.appendChild(img);
    var t = document.createElement('span');
    t.className = 'txt';
    t.innerHTML = '<span class="nm"></span><span class="ds"></span>';
    t.querySelector('.nm').textContent = it.name;
    t.querySelector('.ds').textContent = it.desc || '';
    a.appendChild(fav);
    a.appendChild(t);
    g.appendChild(a);
    all.push({ el: a, kw: a.getAttribute('data-kw') });
  });
  box.appendChild(h);
  box.appendChild(g);
  wrap.appendChild(box);
});

cntEl.textContent = all.length;
cnEl.textContent = SITES.length;

function toast(m) {
  var t = document.getElementById('toast');
  t.textContent = m; t.classList.add('on');
  clearTimeout(toast._t); toast._t = setTimeout(function () { t.classList.remove('on'); }, 1400);
}

qEl.addEventListener('input', function () {
  var q = qEl.value.trim().toLowerCase();
  var shown = 0;
  all.forEach(function (o) {
    var vis = !q || o.kw.indexOf(q) >= 0;
    o.el.style.display = vis ? '' : 'none';
    if (vis) shown++;
  });
  cntEl.textContent = shown;
  toast('匹配 ' + shown + ' 个站点');
});

if ('serviceWorker' in navigator) {
  window.addEventListener('load', function () {
    navigator.serviceWorker.register('sw.js').catch(function () {});
  });
}
</script>
</body>
</html>
