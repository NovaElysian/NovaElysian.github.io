<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>通用编辑器 - 预设中心</title><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><script>try{if(localStorage.getItem("editor_theme")==="dark")document.body.classList.add("dark-theme")}catch(e){}</script>
    <style>
:root{
  --bg-color:#f5f6f8;--card-bg:#ffffff;--text-main:#1a1a1a;--text-sub:#777777;
  --border-color:#e0e0e0;--accent-color:#fb7299;--dark-btn:#1a2232;
  --seg-active-bg:#1a2232;--seg-active-text:#ffffff;
  --radius:12px;--shadow:0 2px 10px rgba(0,0,0,.05);
}
body.dark-theme{--bg-color:#151724;--card-bg:#1a1c29;--text-main:#e0e0e0;
  --text-sub:#a0a0a0;--border-color:#2a2d3e;--dark-btn:#2a2d3e;
  --seg-active-bg:#ffffff;--seg-active-text:#1a1a1a;--shadow:0 2px 10px rgba(0,0,0,.3)}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  background:var(--bg-color);color:var(--text-main);min-height:100vh;padding:clamp(14px,3vw,28px)}
.container{max-width:900px;margin:0 auto}
.page-head{text-align:center;margin-bottom:24px}
.page-head h1{font-size:clamp(20px,5vw,26px);font-weight:700;color:var(--text-main)}
.page-head p{font-size:13px;color:var(--text-sub);margin-top:6px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px}
.card{background:var(--card-bg);border:1px solid var(--border-color);border-radius:var(--radius);
  padding:16px;display:flex;flex-direction:column;justify-content:space-between;box-shadow:var(--shadow)}
.card-header{font-weight:700;font-size:15px;color:var(--text-main);word-break:break-all;margin-bottom:6px}
.card-category{font-size:12px;color:var(--accent-color);margin-bottom:12px}
.btn-group{display:flex;gap:10px}
button{flex:1;padding:9px 12px;border:none;border-radius:8px;cursor:pointer;font-weight:600;font-size:13px;transition:.2s;color:#fff}
button:hover{filter:brightness(1.1)}
button:active{transform:scale(.97)}
.btn-preview{background:var(--accent-color);margin-bottom:10px}
.btn-copy{background:var(--dark-btn)}
.btn-download{background:#4caf50}
#modal{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.6);justify-content:center;align-items:center;z-index:200;backdrop-filter:blur(2px)}
#modal.show{display:flex}
.modal-box{background:var(--card-bg);width:85%;height:80%;border-radius:var(--radius);border:1px solid var(--border-color);padding:16px;display:flex;flex-direction:column;box-shadow:var(--shadow)}
.modal-title{font-weight:700;font-size:15px;color:var(--text-main);margin-bottom:10px}
textarea{flex:1;background:var(--bg-color);color:var(--text-main);border:1px solid var(--border-color);
  padding:10px;font-family:"Courier New",Consolas,monospace;resize:none;border-radius:8px;margin-bottom:10px;font-size:13px;line-height:1.6}
.modal-foot{display:flex;gap:10px}
.close-btn{background:#ef4444;padding:8px 14px}
.copy-modal-btn{background:var(--accent-color)}
</style>
</head>
<body>
<script>
<script>
(function(){function addBack(){var b=document.createElement("div");b.id="back-btn";
b.textContent="\u2190 返回";b.style.cssText="position:fixed;left:12px;top:12px;z-index:1000;"+
"background:var(--accent-color);color:#fff;padding:7px 14px;border-radius:18px;font-size:13px;"+
"font-weight:600;cursor:pointer;box-shadow:var(--shadow);";
b.addEventListener("click",function(){if(window.history.length>1)window.history.back();else window.location.href="./index.html";});
document.body.appendChild(b);}
if(document.body)addBack();else document.addEventListener("DOMContentLoaded",addBack);})();
</script>
</script>

    <div class="container">
        <h1>Minecraft Preset Code Center</h1>
        <div class="grid" id="grid"></div>
    </div>
    
    <div id="modal">
        <div class="modal-box">
            <button class="close-btn" onclick="document.getElementById('modal').style.display='none'">关闭</button>
            <textarea id="modal-text" readonly></textarea>
        </div>
    </div>

    <script>
        const files = [{"name": "撤离5cb教程版新", "path": "./presets/extraction/extraction-tutorial-v2/撤离5cb教程版新.txt", "category": "extraction"}, {"name": "开箱", "path": "./presets/extraction/loot-airdrop/开箱.txt", "category": "extraction"}, {"name": "开箱（压缩版未测试）", "path": "./presets/extraction/loot-airdrop/开箱（压缩版未测试）.txt", "category": "extraction"}, {"name": "空投", "path": "./presets/extraction/loot-airdrop/空投.txt", "category": "extraction"}, {"name": "匹配系统，固定随机刷新点", "path": "./presets/extraction/matchmaking/匹配系统，固定随机刷新点.txt", "category": "extraction"}, {"name": "雪球菜单参赛作品", "path": "./presets/menus/snowball-contest/雪球菜单参赛作品.txt", "category": "menus"}, {"name": "互传", "path": "./presets/menus/snowball-v2/互传.txt", "category": "menus"}, {"name": "前置（必看）", "path": "./presets/menus/snowball-v2/前置（必看）.txt", "category": "menus"}, {"name": "菜单第一页", "path": "./presets/menus/snowball-v2/菜单第一页.txt", "category": "menus"}, {"name": "菜单第七页", "path": "./presets/menus/snowball-v2/菜单第七页.txt", "category": "menus"}, {"name": "菜单第三页", "path": "./presets/menus/snowball-v2/菜单第三页.txt", "category": "menus"}, {"name": "菜单第二页", "path": "./presets/menus/snowball-v2/菜单第二页.txt", "category": "menus"}, {"name": "菜单第五页", "path": "./presets/menus/snowball-v2/菜单第五页.txt", "category": "menus"}, {"name": "菜单第六页", "path": "./presets/menus/snowball-v2/菜单第六页.txt", "category": "menus"}, {"name": "菜单第四页", "path": "./presets/menus/snowball-v2/菜单第四页.txt", "category": "menus"}, {"name": "转账", "path": "./presets/menus/snowball-v2/转账.txt", "category": "menus"}, {"name": "前置［必看第一个］", "path": "./presets/menus/snowball-yellow/前置［必看第一个］.txt", "category": "menus"}, {"name": "第一页雪球菜单", "path": "./presets/menus/snowball-yellow/第一页雪球菜单.txt", "category": "menus"}, {"name": "雪球菜单互传第四页", "path": "./presets/menus/snowball-yellow/雪球菜单互传第四页.txt", "category": "menus"}, {"name": "雪球菜单其他第五页", "path": "./presets/menus/snowball-yellow/雪球菜单其他第五页.txt", "category": "menus"}, {"name": "雪球菜单多维第二页", "path": "./presets/menus/snowball-yellow/雪球菜单多维第二页.txt", "category": "menus"}, {"name": "雪球菜单转账第三页", "path": "./presets/menus/snowball-yellow/雪球菜单转账第三页.txt", "category": "menus"}, {"name": "防熊指令", "path": "./presets/misc/anti-grief/防熊指令.txt", "category": "misc"}, {"name": "日历前台", "path": "./presets/misc/calendar/日历前台.txt", "category": "misc"}, {"name": "日历后台", "path": "./presets/misc/calendar/日历后台.txt", "category": "misc"}, {"name": "自定义钓鱼", "path": "./presets/misc/custom-fishing/自定义钓鱼.txt", "category": "misc"}, {"name": "抽奖指令", "path": "./presets/misc/lottery/抽奖指令.txt", "category": "misc"}, {"name": "手动签到教程版", "path": "./presets/misc/manual-signin/手动签到教程版.txt", "category": "misc"}, {"name": "创建地皮模板", "path": "./presets/shop-plots/advanced-plots/创建地皮模板.txt", "category": "shop-plots"}, {"name": "创建空岛", "path": "./presets/shop-plots/advanced-plots/创建空岛.txt", "category": "shop-plots"}, {"name": "前台", "path": "./presets/shop-plots/advanced-plots/前台.txt", "category": "shop-plots"}, {"name": "地皮保护", "path": "./presets/shop-plots/advanced-plots/地皮保护.txt", "category": "shop-plots"}, {"name": "前台", "path": "./presets/shop-plots/basic-plots/前台.txt", "category": "shop-plots"}, {"name": "后台", "path": "./presets/shop-plots/basic-plots/后台.txt", "category": "shop-plots"}, {"name": "[前置]创建栓绳", "path": "./presets/shop-plots/bulk-shop/[前置]创建栓绳.txt", "category": "shop-plots"}, {"name": "免举商店 完整版", "path": "./presets/shop-plots/bulk-shop/免举商店 完整版.txt", "category": "shop-plots"}];
        const grid = document.getElementById('grid');

        files.forEach(file => {
            const card = document.createElement('div');
            card.className = 'card';
            card.innerHTML = `
                <div>
                    <div class="card-header">${file.name}</div>
                    <div class="card-category">分类: ${file.category}</div>
                </div>
                <div>
                    <button class="btn-preview" onclick="loadText('${file.path}', true)">预览 / 查看</button>
                    <div class="btn-group">
                        <button class="btn-copy" onclick="loadText('${file.path}', false)">复制内容</button>
                        <button class="btn-download" onclick="downloadFile('${file.path}', '${file.name}.txt')">下载</button>
                    </div>
                </div>`;
            grid.appendChild(card);
        });

        async function loadText(path, isPreview) {
            try {
                const res = await fetch(path);
                if (!res.ok) throw new Error("文件未找到");
                const text = await res.text();
                if (isPreview) {
                    document.getElementById('modal-text').value = text;
                    document.getElementById('modal').style.display = 'flex';
                } else {
                    await navigator.clipboard.writeText(text);
                    alert('已成功复制到剪贴板！');
                }
            } catch (e) {
                alert('操作失败: ' + e.message);
            }
        }

        function downloadFile(path, filename) {
            const a = document.createElement('a');
            a.href = path;
            a.download = filename;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
        }
    </script>

    <script>
    function copyModal(){var t=document.getElementById('modal-text');if(navigator.clipboard)navigator.clipboard.writeText(t.value).then(function(){alert('已复制');});}
    </script>
    </body>
</html>
